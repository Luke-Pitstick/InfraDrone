[project]
name = "infradrone"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "albumentations>=2.0.8",
    "coco-to-yolo>=1.2.1",
    "fastapi>=0.136.1",
    "matplotlib>=3.10.8",
    "modal>=1.4.2",
    "opencv-python>=4.13.0.92",
    "pillow>=12.2.0",
    "pycocotools>=2.0.11",
    "pyyaml>=6.0.3",
    "redis>=8.0.0",
    "roboflow>=1.3.7",
    "scikit-image>=0.26.0",
    "ultralytics>=8.4.41",
    "wandb>=0.19.0",
]

[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "ipympl>=0.10.0",
    "marimo>=0.23.2",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
